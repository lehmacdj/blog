# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: Unformed Delta
email: lehmacdj@gmail.com
description: >
  A place to collect the things I learn, figure out, or find interesting.
baseurl: ""
url: "https://unformeddelta.wiki" # the base hostname & protocol for your site
github_username: lehmacdj
permalink: /:year/:month/:day/:title.html

# Build settings
markdown: kramdown
exclude: ["CLAUDE.md"]
plugins:
  - jekyll-redirect-from

# Collections
collections:
  notes:
    output: true
    sort_by: date
