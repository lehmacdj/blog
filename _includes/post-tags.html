{% assign sorted_tags = include.tags | sort %}
{% for tag in sorted_tags %}
{% assign count = 0 %}
{% for note in site.notes %}
  {% if note.tags contains tag %}
    {% assign count = count | plus: 1 %}
  {% endif %}
{% endfor %}
<a class="tag-btn" href="{{ site.baseurl }}/tagged/{{ tag }}/" rel="tag">{{ tag }}<span class="tag-count">{{ count }}</span></a>
{% endfor %}
